<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07090c">
  <title>Detector Test | VReview</title>
  <link rel="stylesheet" href="css/base.css?v=20260903-1">
  <link rel="stylesheet" href="css/layout.css?v=20260903-1">
  <link rel="stylesheet" href="css/components.css?v=20260903-1">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="index.html">VReview</a>
      <p class="brand-sub">Clip analysis workbench</p>
      <nav class="nav-list" aria-label="メインナビゲーション">
        <a class="nav-item" href="index.html">Dashboard</a>
        <a class="nav-item" href="review.html">New Review</a>
        <a class="nav-item active" href="detector-test.html" aria-current="page">Detector Test</a>
        <a class="nav-item" href="diagnostics.html">Diagnostics</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="page-header compact">
        <div>
          <p class="eyebrow">Detector Validation · <span data-app-version>--</span></p>
          <h1>Feedback ZIPを比較</h1>
          <p class="lead">複数クリップのPrecision / Recall / primary精度をまとめて確認し、1本だけにDetectorを合わせすぎないための検証画面です。</p>
        </div>
      </header>

      <section class="panel">
        <label class="dropzone test-dropzone" id="testDropzone" for="testZipInput" role="button" tabindex="0" aria-describedby="testZipHelp">
          <input id="testZipInput" type="file" accept=".zip,application/zip" multiple hidden>
          <strong>Feedback ZIPを開く</strong>
          <span id="testZipHelp">v0.8.0のまとめZIPは1個だけでOK。従来の単体ZIPも複数選択できます。元動画は不要です。</span>
        </label>
        <p class="helper" style="margin:12px 0 0">Recallは手動追加された有効Sceneを見逃しとして計算します。未確認Labelが残る場合は暫定値です。</p>
      </section>

      <section id="testSummary" aria-live="polite">
        <div class="status-callout pending">ZIPを選択するとSchema検証後に集計します。</div>
      </section>
      <section id="testResults"></section>
    </main>
  </div>

  <script src="js/version.js?v=20260903-1"></script>
  <script src="js/diagnostics.js?v=20260903-1"></script>
  <script src="js/detector-test.js?v=20260903-1"></script>
</body>
</html>
