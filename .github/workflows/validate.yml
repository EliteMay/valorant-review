name: Validate VReview

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find js scripts tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

      - name: Validate project structure and references
        run: node scripts/validate.mjs

      - name: Run storage regression tests
        run: node tests/storage.test.mjs
