name: Validate VReview

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find js scripts tests electron -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0)

      - name: Validate project structure and references
        run: node scripts/validate.mjs

      - name: Run storage regression tests
        run: node tests/storage.test.mjs

      - name: Run detector metrics regression tests
        run: node tests/detector-metrics.test.mjs

      - name: Run desktop pure-node regression tests
        run: |
          node tests/telemetry-event.test.mjs
          node tests/updater-version.test.mjs
          node tests/recording-controller.test.mjs
