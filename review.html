<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d10">
  <title>New Review | VReview</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="index.html">VReview</a>
      <p class="brand-sub">VALORANT Clip Analysis</p>
      <nav class="nav-list" aria-label="メインナビゲーション">
        <a class="nav-item" href="index.html">Dashboard</a>
        <a class="nav-item active" href="review.html">New Review</a>
        <a class="nav-item" href="result.html">Import / Result</a>
        <a class="nav-item" href="history.html">History</a>
        <a class="nav-item" href="training.html">Training</a>
        <a class="nav-item" href="settings.html">Settings</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="page-header compact">
        <div>
          <p class="eyebrow">NEW REVIEW</p>
          <h1>クリップ解析</h1>
          <p class="lead">動画はブラウザ内で処理します。元動画を外部へ自動送信しません。</p>
        </div>
      </header>

      <section class="panel" id="uploadPanel">
        <label class="dropzone" id="dropzone" for="videoInput">
          <input id="videoInput" type="file" accept="video/mp4,video/webm" hidden>
          <strong>動画をここにドロップ</strong>
          <span>またはクリックして MP4 / WebM を選択</span>
        </label>
      </section>

      <section class="review-workspace hidden" id="workspace">
        <div class="video-column">
          <section class="panel video-panel">
            <div class="video-meta" id="videoMeta"></div>
            <video id="videoPreview" controls preload="metadata"></video>
            <div class="timeline-wrap">
              <div class="timeline" id="timeline"></div>
            </div>
            <div class="button-row">
              <button class="btn btn-secondary" id="setStartBtn" type="button">現在位置を開始に設定</button>
              <button class="btn btn-secondary" id="setEndBtn" type="button">現在位置を終了に設定</button>
              <button class="btn btn-primary" id="addSceneBtn" type="button">Scene追加</button>
            </div>
          </section>
        </div>

        <div class="scene-column">
          <section class="panel">
            <div class="section-heading">
              <div>
                <p class="eyebrow">SCENES</p>
                <h2>Combat Scene確認</h2>
              </div>
              <span class="badge" id="sceneCount">0 scenes</span>
            </div>
            <p class="helper">自動検出は次段階で実装予定。現時点では手動追加・編集のUIを先に検証できます。</p>
            <div class="scene-list" id="sceneList"></div>
          </section>

          <section class="panel">
            <div class="section-heading">
              <div>
                <p class="eyebrow">PACKAGE</p>
                <h2>解析パッケージ</h2>
              </div>
            </div>
            <div class="status-callout pending">
              コンタクトシート生成とZIP出力は未実装です。Scene編集が安定した後に追加します。
            </div>
            <button class="btn btn-primary full" type="button" disabled>ChatGPT解析パッケージを作成</button>
          </section>
        </div>
      </section>
    </main>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/video.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
