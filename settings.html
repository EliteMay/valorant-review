<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07090c">
  <title>設定 | VReview</title>
  <link rel="stylesheet" href="css/base.css?v=20261004-1">
  <link rel="stylesheet" href="css/layout.css?v=20261004-1">
  <link rel="stylesheet" href="css/components.css?v=20261004-1">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="index.html">VReview</a>
      <p class="brand-sub">Aim analysis workbench</p>
      <nav class="nav-list" aria-label="メインナビゲーション">
        <a class="nav-item" href="index.html">Dashboard</a>
        <a class="nav-item" href="review.html">New Review</a>
        <a class="nav-item" href="tracker-collector.html">Tracker収集</a>
        <a class="nav-item" href="detector-test.html">Detector Test</a>
        <a class="nav-item" href="diagnostics.html">Diagnostics</a>
        <a class="nav-item active" href="settings.html" aria-current="page">設定</a>
      </nav>
    </aside>
    <main class="main-content">
      <header class="page-header compact">
        <div>
          <p class="eyebrow">Desktop Foundation · <span data-app-version>--</span></p>
          <h1>設定</h1>
          <p class="lead">Electron版の共通設定です。Web版では閲覧のみで、Desktop固有設定は変更しません。</p>
        </div>
      </header>

      <section class="panel" id="desktopSettingsRoot">
        <div class="section-heading"><div><p class="eyebrow">Runtime</p><h2>Desktop状態</h2></div></div>
        <div class="status-callout pending" id="desktopModeStatus">Desktop Runtimeを確認しています…</div>
        <p class="helper mono" id="desktopRuntimeInfo"></p>

        <div class="status-list">
          <label class="status-row">
            <span>起動時にUpdateを確認</span>
            <input id="settingAutoCheck" type="checkbox">
          </label>
          <label class="status-row">
            <span>Update Channel</span>
            <select id="settingUpdateChannel">
              <option value="latest">latest</option>
              <option value="beta">beta</option>
            </select>
          </label>
          <label class="status-row">
            <span>解析Worker数</span>
            <select id="settingWorkerConcurrency">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
            </select>
          </label>
          <div class="status-row">
            <span>録画保存先</span>
            <strong class="mono" id="recordingSaveDirectory">既定</strong>
          </div>
        </div>

        <div class="section-heading" style="margin-top:22px"><div><p class="eyebrow">Tracker Collector</p><h2>Tracker収集</h2></div></div>
        <div class="status-list">
          <div class="status-row"><span>保存先</span><strong class="mono" id="trackerSaveDirectory">既定</strong></div>
          <label class="status-row"><span>最大Capture数</span><select id="trackerMaxCaptures"><option value="20">20</option><option value="50">50</option><option value="100">100</option></select></label>
          <label class="status-row"><span>画面安定待ち</span><select id="trackerStableWait"><option value="300">300 ms</option><option value="400">400 ms</option><option value="600">600 ms</option><option value="900">900 ms</option></select></label>
          <label class="status-row"><span>Scroll重複</span><select id="trackerScrollRatio"><option value="0.75">約25%</option><option value="0.8">約20%</option><option value="0.85">約15%</option></select></label>
          <label class="status-row"><span>対象ブラウザ</span><select id="trackerBrowser"><option value="chrome">Chrome</option><option value="edge">Edge</option><option value="firefox">Firefox</option></select></label>
          <label class="status-row"><span>ZIP圧縮</span><select id="trackerCompression"><option value="fast">高速</option><option value="standard">標準</option><option value="maximum">最大</option></select></label>
          <label class="status-row"><span>完了後にFolderを開く</span><input id="trackerAutoOpen" type="checkbox"></label>
        </div>
        <div class="button-row">
          <button class="btn btn-secondary" id="chooseTrackerFolder" data-desktop-action type="button">Tracker保存先を選ぶ</button>
          <a class="btn btn-secondary" href="tracker-collector.html">Calibration / 収集画面</a>
        </div>

        <div class="button-row">
          <button class="btn btn-primary" id="saveDesktopSettings" data-desktop-action type="button">設定を保存</button>
          <button class="btn btn-secondary" id="checkDesktopUpdates" data-desktop-action type="button">Update確認・適用</button>
          <button class="btn btn-secondary" id="chooseRecordingFolder" data-desktop-action type="button">録画保存先を選ぶ</button>
          <button class="btn btn-secondary" id="openDesktopLogs" data-desktop-action type="button">Log Folder</button>
          <button class="btn btn-danger" id="resetDesktopSettings" data-desktop-action type="button">既定値へ戻す</button>
        </div>
        <div class="status-callout success hidden" id="desktopSettingsStatus" aria-live="polite"></div>
      </section>
    </main>
  </div>
  <script src="js/version.js?v=20261004-1"></script>
  <script src="js/desktop-settings.js?v=20261004-1"></script>
</body>
</html>
